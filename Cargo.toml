[workspace]
members = [
    "crates/officecli-core",
    "crates/officecli-cli",
    "crates/officecli-server",
    "crates/officecli-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Boos4721 <boos4721@icloud.com>"]
description = "Rust implementation of OfficeCLI OOXML automation primitives"
repository = "https://github.com/Boos4721/officecli-rs"
homepage = "https://github.com/Boos4721/officecli-rs"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
http = "1"
quick-xml = "0.37"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
zip = "2.4"
