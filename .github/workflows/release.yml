name: officecli-rs release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

defaults:
  run:
    working-directory: officecli-rs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  binaries:
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: officecli-linux-x64
          - target: aarch64-unknown-linux-gnu
            asset: officecli-linux-arm64
          - target: x86_64-pc-windows-gnu
            asset: officecli-win-x64.exe
          - target: x86_64-apple-darwin
            asset: officecli-mac-x64
          - target: aarch64-apple-darwin
            asset: officecli-mac-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions-rust-lang/setup-rust-cross@v0.2
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release -p officecli --target ${{ matrix.target }}
      - run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/officecli* release/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: officecli-rs/release/${{ matrix.asset }}

  publish:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - run: find release -type f -exec sha256sum {} \; > SHA256SUMS
        working-directory: .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**
            SHA256SUMS

  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: officecli-rs
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/officecli-rs:${{ github.ref_name }}
